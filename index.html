<html>

<head>
    <title>Color Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="color-generator">
        <h1>Color Generator</h1>
        <div class="color-box">No color generated yet, click to generate color</div>
        <span class="hex-code">Hex Code</span>
        <p class="color-value">RGB Value</p>
        <button>Generate Color</button>
        <h3>Previous colors you generated</h3>
        <div class="previous-generated-colors">
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
